project_id = "meridian-health-ehr"

[api]
enabled = true
port = 54321
schemas = ["public", "auth", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
# ponytail: require email confirmation before a profile is usable in prod.
enable_confirmations = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.providers]
# Passwordless OTP / magic link — flip on in Studio or here.
email_otp = true

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
