name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must match the local toolchain (AGENTS.md pins Node 24). Node 20 was
          # drift: Vite 7 needs >=20.19, so it passed by luck, not by design.
          node-version: 24
          cache: npm
      - run: npm ci
      # Ship-no-secrets guard: a committed .env (or a data dump) in a health-record
      # repo is a breach waiting to happen, and it is cheap to make impossible.
      - name: No committed env files or data dumps
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^\.env$|^\.env\.(local|production|dev)$'; then
            echo "::error::A real .env is tracked. Only .env.example and .env.demo may be committed."
            exit 1
          fi
          if git ls-files | grep -Ei '(patient[-_]?export|phi|real[-_]?data)\.(json|csv|sql)'; then
            echo "::error::A file that looks like a patient data export is tracked."
            exit 1
          fi
      # Supply-chain report. Advisory fixes that require a major-version bump are a
      # human decision, so this annotates rather than blocks the whole pipeline.
      - name: Dependency audit (report)
        run: npm audit --audit-level=high || echo "::warning::npm audit reported high/critical advisories — see the log; schedule the upgrade."
      - run: npm run typecheck
      # --max-warnings=0 makes every warning blocking — that is the point. The
      # LabResults stale-closure bug (useMemo with [] deps over `patients`) sat
      # in CI as a *warning* before it was fixed. react-refresh is exempted
      # because it is HMR-ergonomics only: colocating a context or hook with its
      # component is a legitimate pattern. Drop the exemption and fix the 8
      # remaining warnings once contexts live in their own files.
      - run: npx eslint . --max-warnings=0 --rule '{"react-refresh/only-export-components":"off"}'
      - run: npm test
      # Both artifacts are verified: the default build is production mode (must
      # fail closed without a backend) and the demo build is what clinics preview.
      - run: npm run build
      - run: npm run build:demo
